# Bun configuration.
#
# [test].preload runs test-preload.ts before any test file (or its imports)
# loads. It redirects the ib-watch diagnostic log to a throwaway temp file and
# replaces the coordinator/tmux-poller spawn defaults with an inert runner, so
# `bun test` can neither pollute the live watch log nor touch the developer's
# fixed-name `ib-coordinator` tmux session.
[test]
preload = ["./test-preload.ts"]
